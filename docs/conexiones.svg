text x="875" y="275" font-size="20" font-family="DejaVu Sans" fill="#152C43">DE-9 pin 5 GND</text><text x="290" y="120" font-size="18" font-family="DejaVu Sans" fill="#152C43">3.3 V</text><text x="713" y="120" font-size="18" font-family="DejaVu Sans" fill="#152C43">RS-232</text><text x="25" y="345" font-size="21" font-family="DejaVu Sans" fill="#152C43">GND común. Alimentación desde Pico. Pinout del adaptador: DTE estándar.</text><text x="25" y="375" font-size="18" font-family="DejaVu Sans" fill="#152C43">Verificar continuidad si el módulo ya trae DE-9. El USB de Pico no transporta el REPL.</text></svg>